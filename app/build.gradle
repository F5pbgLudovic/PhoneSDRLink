plugins { id 'com.android.application' }

android {
    namespace 'fr.f5pbg.phonesdrlink'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'fr.f5pbg.phonesdrlink'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '1.16'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    signingConfigs {
        release {
            storeFile file('../phonesdrlink.jks')
            storePassword 'phonesdrlink'
            keyAlias 'phonesdrlink'
            keyPassword 'phonesdrlink'
        }
    }
    buildTypes {
        release {
            if (file('../phonesdrlink.jks').exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}